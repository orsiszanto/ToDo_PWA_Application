<div class="page-container">
  <main>
    <section class="content" fxLayout="column" fxLayoutAlign="center center">
      <mat-card class="card">
        <input [(ngModel)]="newTodo" placeholder="Új teendő..." />
        <button
          mat-raised-button
          color="primary"
          class="todo-btn"
          (click)="addTodo()"
        >
          Hozzáadás
        </button>
        <mat-list class="todo-list">
          <mat-list-item *ngFor="let todo of todos$ | async" class="todo-item">
            <mat-checkbox
              [checked]="todo.completed"
              (change)="toggleCompletion(todo)"
            >
              {{ todo.title }}
            </mat-checkbox>
            <button mat-icon-button color="warn" (click)="deleteTodo(todo)">
              <mat-icon>delete</mat-icon>
            </button>
          </mat-list-item>
        </mat-list>
      </mat-card>
      <button
        mat-raised-button
        color="primary"
        class="logout-button"
        (click)="logout()"
      >
        Kijelentkezés
      </button>
    </section>
  </main>
</div>
